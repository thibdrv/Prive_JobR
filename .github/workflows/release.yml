# When a version tag is pushed (git tag v1.0 then git push origin v1.0), GitHub builds the app for Windows and for
# Linux, then publishes both in a Release, ready to download:
#   RetrieveJob-windows.zip     RetrieveJob.exe and its _internal folder
#   RetrieveJob-linux.tar.gz    RetrieveJob and its _internal folder
# Each system builds its own program (one can't be made for another), so each is built on its own machine.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: dist/RetrieveJob-windows.zip
            checks: python -m unittest
          # An older Linux on purpose: a program built there also runs on the newer ones, not the reverse.
          # If GitHub stops offering it, use ubuntu-24.04 (the program then needs a 2024 Linux or newer).
          - os: ubuntu-22.04
            file: dist/RetrieveJob-linux.tar.gz
            checks: xvfb-run -a python -m unittest  # the window test needs a screen: a virtual one
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checks before building
        run: |
          python -m pip install -r requirements.txt
          ${{ matrix.checks }}
      - name: Build the app
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ matrix.file }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" apps/*
          --repo "${{ github.repository }}" --title "Retrieve Job ${{ github.ref_name }}" --generate-notes
